[package]
name = "ffforge"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ffforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Same indexmap workaround for the build-dependency graph (tauri-build ->
# schemars -> indexmap): build-dep features are unified separately from
# normal deps, so `std` must be enabled here as well.
indexmap = { version = "1.9", features = ["std"] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "time", "rt"] }

# Workaround: schemars (via tauri) pulls indexmap 1.9.3, whose `std` feature is
# not default and whose autocfg `has_std` probe fails on current rustc, breaking
# compilation. Enabling `std` here makes indexmap's build script emit `has_std`
# unconditionally via feature unification.
indexmap = { version = "1.9", features = ["std"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
